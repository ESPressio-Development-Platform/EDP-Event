[env:esp32dev]
; Pinned because pioarduino stable 55.3.311 conflicts with PlatformIO Core 6.2.x SCons management for framework=espidf.
; This revision uses ESP-IDF 5.5.5 and SCons 4.11.1 and is already compile/link validated.
platform = https://github.com/pioarduino/platform-espressif32.git#d41d8383706dc146fd91a0e1d3c59a915a4d493e
board = esp32dev
framework = espidf

; esptool 5.4.0 currently crashes in its progress renderer on this PlatformIO/pioarduino path.
; --no-progress is a write-flash subcommand option, so a post-script inserts it after write-flash.
extra_scripts =
    post:scripts/esptool_no_progress.py

monitor_speed = 115200
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=gnu++20
lib_deps =
    https://github.com/ESPressio-Development-Platform/EDP-Event.git#event_v1
    https://github.com/ESPressio-Development-Platform/EDP-System.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Primitives.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Memory.git#event_v1
    https://github.com/ESPressio-Development-Platform/EDP-Threading.git#event_v1
    https://github.com/ESPressio-Development-Platform/EDP-Clock.git#main
    https://github.com/ESPressio-Development-Platform/EDP-BoundedTopology.git#main
    https://github.com/ESPressio-Development-Platform/EDP-BoundedTypes.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform-Portable.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform-FreeRTOS.git#main
    https://github.com/ESPressio-Development-Platform/EDP-Platform-ESP-IDF.git#main
